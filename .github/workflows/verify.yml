name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Check Python dependency lock
        run: uv lock --project apps/api --check

      - name: Sync locked API environment
        run: uv sync --project apps/api --locked --extra dev

      - name: Check FastAPI OpenAPI snapshot
        run: >-
          uv run --project apps/api --locked --extra dev
          python -m quakecurrent.openapi_export
          --check packages/api-client/openapi.json

      - name: Run deterministic API tests
        run: >-
          uv run --project apps/api --locked --extra dev
          python -m pytest -m "not integration" apps/api/tests

  api-container:
    name: API container
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build locked API image
        run: docker build --tag quakecurrent-api:verify apps/api

      - name: Verify runtime package and non-root user
        run: >-
          docker run --rm --entrypoint python quakecurrent-api:verify
          -c "import os, fastapi, quakecurrent;
          assert os.geteuid() != 0;
          print(f'FastAPI {fastapi.__version__}')"

  web:
    name: Web and URL filters
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated OpenAPI client
        run: npm run check:api-client-contract

      - name: Run unit tests
        run: npm test

      - name: Run generated client tests
        run: npm run test:client

      - name: Check types
        run: npm run typecheck

      - name: Check lint
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Verify server-rendered routes
        run: npm run test:ssr

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e:run

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: apps/web/outputs/
          if-no-files-found: ignore
          retention-days: 7
