name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API dependencies
        run: python -m pip install -e "./apps/api[dev]"

      - name: Check FastAPI OpenAPI snapshot
        run: >-
          python -m quakecurrent.openapi_export
          --check packages/api-client/openapi.json

      - name: Run deterministic API tests
        run: python -m pytest -m "not integration" apps/api/tests

  web:
    name: Web and URL filters
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated OpenAPI client
        run: npm run check:api-client-contract

      - name: Run unit tests
        run: npm test

      - name: Run generated client tests
        run: npm run test:client

      - name: Check types
        run: npm run typecheck

      - name: Check lint
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Verify server-rendered routes
        run: npm run test:ssr

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e:run

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: outputs/
          if-no-files-found: ignore
          retention-days: 7
