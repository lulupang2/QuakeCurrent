name: quakecurrent

x-api-environment: &api-environment
  DATABASE_URL: postgresql+asyncpg://quakecurrent:quakecurrent@postgis:5432/quakecurrent
  REDIS_URL: redis://redis:6379/0
  USGS_ALL_DAY_URL: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson
  ALLOWED_ORIGINS: http://localhost:3000
  SNAPSHOT_WINDOW_HOURS: "30"
  USGS_TIMEOUT_SECONDS: "15"
  USGS_MAX_RESPONSE_BYTES: "8000000"
  CHANGE_PAGE_SIZE: "200"
  WS_CATCHUP_LIMIT: "500"

services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: quakecurrent
      POSTGRES_USER: quakecurrent
      POSTGRES_PASSWORD: quakecurrent
    ports:
      - "5432:5432"
    volumes:
      - quakecurrent_postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quakecurrent -d quakecurrent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment: *api-environment
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn quakecurrent.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    environment: *api-environment
    command:
      - celery
      - -A
      - quakecurrent.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./apps/api
    environment: *api-environment
    command:
      - celery
      - -A
      - quakecurrent.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  quakecurrent_postgis:
