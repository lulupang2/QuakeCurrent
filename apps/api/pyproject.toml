[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quakecurrent-api"
version = "0.1.0"
description = "QuakeCurrent earthquake ingestion and realtime API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.17,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quakecurrent"]

[tool.uv]
required-version = "==0.12.0"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a running PostgreSQL/PostGIS database",
]

[tool.coverage.run]
source = ["quakecurrent"]
branch = true
